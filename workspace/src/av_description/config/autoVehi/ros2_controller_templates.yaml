# controller_manager  the necessary infrastructure to manage multiple controllers
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    skid_steer_controller:
      type: diff_drive_controller/DiffDriveController

# Parameters for our custom skid steer setup
skid_steer_controller:
  ros__parameters:
    left_wheel_names: ["${prefix}wheel_left_top_joint", "${prefix}wheel_left_bot_joint"]
    right_wheel_names: ["${prefix}wheel_right_top_joint", "${prefix}wheel_right_bot_joint"]

    # use_stamped_vel: false
    wheel_separation: 0.50 
    wheel_radius: 0.15      
    
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0 
    right_wheel_radius_multiplier: 1.0 

    # TF configuration
    odom_frame_id: odom
    base_frame_id: base_link 
    
    # Odometry parameters
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    position_feedback: true
    open_loop: false
    enable_odom_tf: true

    # Command handling
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true 
    velocity_rolling_window_size: 10
    publish_rate: 50.0

    # Velocity limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0       
    linear.x.min_velocity: -1.0      
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5   
    
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0      
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 1.0